name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    name: Lint, Build & E2E Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      AUTH_SECRET: ci-auth-secret-test-key-32-characters-minimum

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm@10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Lint
        run: pnpm lint
        continue-on-error: true # green hoyar por eta bondho koro (lint error gulo fix kore)

      - name: Create build database
        env:
          DATABASE_URL: file:./build.db
        run: pnpm db:push

      - name: Build
        env:
          DATABASE_URL: file:./build.db
        run: pnpm build

      - name: Create and seed test database
        run: pnpm test:db

      - name: Install Playwright Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Run E2E tests
        env:
          DATABASE_URL: file:./test.db
          BASE: http://localhost:3457
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          pnpm start -p 3457 &
          npx --yes wait-on http://localhost:3457 --timeout 60000
          pnpm test:e2e

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: e2e/shots
          if-no-files-found: ignore
