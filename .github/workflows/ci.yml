name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-build-test:
    name: Lint, Build & E2E Test
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install pnpm
        run: npm install -g pnpm

      - name: 📥 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🔍 Lint check
        run: pnpm lint

      - name: 🗄️ Generate Prisma Client
        run: pnpm prisma generate

      - name: 🏗️ Build Next.js Application
        env:
          DATABASE_URL: "file:./build.db"
          AUTH_SECRET: "ci-auth-secret-test-key-32-characters-minimum"
        run: pnpm build

      - name: 🧪 Setup Test Database & Seed
        run: pnpm test:db

      - name: 🚀 Run E2E Smoke Tests
        env:
          DATABASE_URL: "file:./test.db"
          AUTH_SECRET: "ci-auth-secret-test-key-32-characters-minimum"
          BASE: "http://localhost:3457"
        run: |
          pnpm start -p 3457 &
          npx wait-on http://localhost:3457 --timeout 60000
          pnpm test:e2e
