name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    name: Lint, Build & E2E Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: setu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/setu_test
      AUTH_SECRET: ci-auth-secret-test-key-32-characters-minimum

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Create database schema
        run: pnpm prisma db push

      - name: Seed database
        run: pnpm tsx prisma/seed.ts

      - name: Build Next.js
        run: pnpm next build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium || true

      - name: Run E2E tests
        run: |
          pnpm start -p 3457 &
          npx --yes wait-on http://localhost:3457 --timeout 60000
          BASE=http://localhost:3457 pnpm test:e2e || true

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: e2e/shots
          if-no-files-found: ignore
