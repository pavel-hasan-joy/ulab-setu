<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d6fb8">
<title>You're offline | ULAB Setu</title>
<style>
  :root { --paper:#f5f8fc; --ink:#16294a; --soft:#5a6b85; --blue:#1d6fb8; --sky:#eaf3fb; }
  @media (prefers-color-scheme: dark) { :root { --paper:#0e1828; --ink:#e4ecf7; --soft:#9aabc4; --blue:#3d8bd0; --sky:#182c47; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--paper); color:var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:24px; text-align:center; }
  .card { max-width:360px; }
  img { width:88px; height:88px; border-radius:22px; box-shadow:0 12px 30px -10px rgba(29,111,184,.5); animation: bob 3s ease-in-out infinite; }
  h1 { font-size:26px; margin:24px 0 8px; letter-spacing:-0.02em; }
  p { color:var(--soft); line-height:1.55; margin:0 0 24px; }
  button { background:var(--blue); color:#fff; border:0; border-radius:12px; padding:12px 20px; font-size:15px; font-weight:600; cursor:pointer; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { img { animation:none; } }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Setu needs an internet connection to show jobs and messages. Check your Wi-Fi or mobile data, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>addEventListener("online", () => location.reload());</script>
</body>
</html>
